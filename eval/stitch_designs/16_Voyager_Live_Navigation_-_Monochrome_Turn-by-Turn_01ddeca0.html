<!DOCTYPE html><html lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport">
<title>Voyager Live Navigation - Monochrome Turn-by-Turn</title>
<!-- Tailwind CSS v3 -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['-apple-system', 'BlinkMacSystemFont', 'SF Pro Text', 'Inter', 'Segoe UI', 'sans-serif'],
            mono: ['SF Mono', 'ui-monospace', 'Menlo', 'monospace']
          },
          colors: {
            voyager: {
              black: '#000000',
              surface: '#0d0e11',
              charcoal: '#17191d',
              border: '#272a30',
              muted: '#737885',
              grid: '#1a1d24',
              highlight: '#f4f5f8'
            }
          }
        }
      }
    }
  </script>
<style data-purpose="custom-animations">
    @keyframes pulse-ring {
      0% { transform: scale(0.95); opacity: 0.8; }
      50% { transform: scale(1.18); opacity: 0.25; }
      100% { transform: scale(0.95); opacity: 0.8; }
    }
    .pulse-layer {
      animation: pulse-ring 2.8s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }
    .route-dash {
      stroke-dasharray: 6, 8;
      animation: dash-move 1.5s linear infinite;
    }
    @keyframes dash-move {
      to { stroke-dashoffset: -28; }
    }
  </style>
<style data-purpose="base-layout">
    body {
      background-color: #050608;
      user-select: none;
      -webkit-font-smoothing: antialiased;
    }
    /* Mobile view boundary simulation */
    .screen-container {
      width: 100%;
      max-width: 412px;
      height: 100dvh;
      max-height: 874px;
      position: relative;
      overflow: hidden;
      box-shadow: 0 25px 60px -15px rgba(0,0,0,0.8), 0 0 0 1px rgba(255,255,255,0.08);
    }
  </style>
</head>
<body class="flex items-center justify-center min-h-screen p-0 sm:p-4 text-white">
<!-- BEGIN: MobileDeviceFrame -->
<main class="screen-container bg-[#08090b] flex flex-col justify-between rounded-none sm:rounded-[48px] relative overflow-hidden" data-purpose="navigation-screen">
<!-- BEGIN: MapBackgroundCanvas -->
<!-- Vector high-contrast monochrome map grid inspired by Uber/Voyager aesthetics -->
<div class="absolute inset-0 z-0 overflow-hidden pointer-events-none" data-purpose="monochrome-vector-map">
<svg class="w-full h-full object-cover" fill="none" viewBox="0 0 400 850" xmlns="http://www.w3.org/2000/svg">
<defs>
<!-- Subtle radial gradient to illuminate car location -->
<radialGradient cx="200" cy="540" gradientUnits="userSpaceOnUse" id="cursorGlow" r="180">
<stop offset="0%" stop-color="#ffffff" stop-opacity="0.08"></stop>
<stop offset="100%" stop-color="#000000" stop-opacity="0"></stop>
</radialGradient>
<filter height="140%" id="routeGlow" width="140%" x="-20%" y="-20%">
<feGaussianBlur result="blur" stdDeviation="3"></feGaussianBlur>
<feComposite in="SourceGraphic" in2="blur" operator="over"></feComposite>
</filter>
</defs>
<!-- Base Dark Ground -->
<rect fill="#0b0d11" height="850" width="400"></rect>
<!-- Water / Park Polygonal Geometry in muted deep grays -->
<path d="M-20,90 Q90,105 180,95 T420,110 L420,-10 L-20,-10 Z" fill="#111419" stroke="#1b2029" stroke-width="1.5"></path>
<text fill="#3a404d" font-size="9" font-weight="700" letter-spacing="1.5" x="210" y="70">EAST RIVER / WATERWAY</text>
<!-- Urban Block Buildings & Parcels -->
<g fill="#101318" stroke="#1a1e26" stroke-width="0.75">
<rect height="52" rx="4" width="85" x="25" y="150"></rect>
<rect height="55" rx="4" width="105" x="130" y="145"></rect>
<rect height="60" rx="4" width="120" x="255" y="140"></rect>
<rect height="65" rx="4" width="88" x="20" y="225"></rect>
<rect height="68" rx="4" width="105" x="130" y="222"></rect>
<!-- Landmark Block: Rockefeller Center Complex -->
<rect fill="#141820" height="72" rx="4" stroke="#28303e" width="120" x="255" y="220"></rect>
<rect height="75" rx="4" width="90" x="15" y="315"></rect>
<rect height="78" rx="4" width="108" x="125" y="312"></rect>
<rect height="82" rx="4" width="125" x="255" y="310"></rect>
<rect height="85" rx="4" width="92" x="10" y="415"></rect>
<rect height="88" rx="4" width="108" x="122" y="412"></rect>
<rect height="92" rx="4" width="135" x="250" y="410"></rect>
<rect height="90" rx="4" width="95" x="5" y="525"></rect>
<rect height="95" rx="4" width="108" x="120" y="522"></rect>
<rect height="95" rx="4" width="140" x="248" y="520"></rect>
<rect height="110" rx="4" width="98" x="0" y="640"></rect>
<rect height="110" rx="4" width="110" x="118" y="638"></rect>
<rect height="110" rx="4" width="145" x="248" y="635"></rect>
</g>
<!-- Secondary Cross Streets (Grid) -->
<g stroke="#1d222b" stroke-linecap="round" stroke-width="2.5">
<!-- Horizontal Avenues -->
<line x1="-10" x2="410" y1="130" y2="125"></line>
<line x1="-10" x2="410" y1="210" y2="205"></line>
<line x1="-10" x2="410" y1="300" y2="295"></line>
<line x1="-10" x2="410" y1="400" y2="395"></line>
<line x1="-10" x2="410" y1="510" y2="505"></line>
<line x1="-10" x2="410" y1="625" y2="620"></line>
<!-- Diagonal / Vertical Streets -->
<line stroke-width="3" x1="115" x2="108" y1="110" y2="760"></line>
<line stroke-width="3.5" x1="242" x2="236" y1="105" y2="760"></line>
<line stroke-width="3" x1="385" x2="380" y1="100" y2="760"></line>
</g>
<!-- Radial Area Light around Current Maneuver Location -->
<circle cx="200" cy="550" fill="url(#cursorGlow)" r="170"></circle>
<!-- Navigation Route Layer (Monochrome Precision Execution) -->
<!-- Inactive / Alternate Route behind -->
<path d="M 198 680 L 198 550 L 198 400 L 198 298 L 108 298" fill="none" opacity="0.75" stroke="#2c313c" stroke-linecap="round" stroke-linejoin="round" stroke-width="9"></path>
<path d="M 198 680 L 198 550 L 198 400 L 198 298 L 108 298" fill="none" stroke="#0f1217" stroke-linecap="round" stroke-linejoin="round" stroke-width="3.5"></path>
<!-- Primary Active Route Path: Clean stark white with dark outer casing -->
<!-- Outer Casing -->
<path d="M 198 760 L 198 540 L 198 400 L 290 398 L 380 397" fill="none" stroke="#000000" stroke-linecap="round" stroke-linejoin="round" stroke-width="12"></path>
<!-- White High-Contrast Core Route -->
<path d="M 198 760 L 198 540 L 198 400 L 290 398 L 380 397" fill="none" stroke="#ffffff" stroke-linecap="round" stroke-linejoin="round" stroke-width="6.5"></path>
<!-- Inner Directional Chevron Stream Line -->
<path class="route-dash" d="M 198 760 L 198 540 L 198 400 L 290 398 L 380 397" fill="none" stroke="#0a0a0c" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"></path>
<!-- Turn Waypoint Circle Marker at (198, 400) -->
<circle cx="198" cy="400" fill="#000000" r="4.5" stroke="#ffffff" stroke-width="2.5"></circle>
<!-- Landmark Callout (Rockefeller Center) -->
<g transform="translate(262, 238)">
<rect fill="#12151b" height="34" rx="6" stroke="#2a3242" stroke-width="1" width="112" x="0" y="0"></rect>
<!-- Icon Mini Tower -->
<path d="M12 24 L12 12 L14 10 L16 12 L16 24 Z M13 10 L15 10 L14 7 Z" fill="#ffffff"></path>
<text fill="#f1f3f7" font-size="8.5" font-weight="700" letter-spacing="-0.1" x="24" y="15">Rockefeller Center</text>
<text fill="#717a8c" font-size="7.5" font-weight="500" x="24" y="26">Live Congestion: Low</text>
</g>
<!-- Street Labels in Map Context -->
<text fill="#4d5464" font-size="8.5" font-weight="600" letter-spacing="0.8" x="130" y="495">MADISON AVE</text>
<text fill="#4d5464" font-size="8.5" font-weight="600" letter-spacing="0.8" x="250" y="495">PARK AVE</text>
<text fill="#4d5464" font-size="8.5" font-weight="600" letter-spacing="0.8" x="18" y="495">5TH AVE</text>
<!-- Current Street name along the route -->
<text fill="#ffffff" font-size="8" font-weight="700" letter-spacing="0.5" opacity="0.85" x="206" y="460">W 47TH ST</text>
<!-- Cross Street -->
<text fill="#a4abb8" font-size="8" font-weight="600" letter-spacing="0.4" x="270" y="388">BROADWAY</text>
<!-- Vehicle Location Puck & Directional Heading Cone -->
<g transform="translate(198, 550)">
<!-- Pulse radar waves -->
<circle class="pulse-layer" cx="0" cy="0" fill="#ffffff" opacity="0.12" r="28"></circle>
<circle cx="0" cy="0" fill="none" opacity="0.3" r="18" stroke="#ffffff" stroke-width="0.75"></circle>
<!-- Dynamic Orientation Field Cone -->
<path d="M0 0 L-20 -44 A50 50 0 0 1 20 -44 Z" fill="url(#coneGradient)" opacity="0.3"></path>
<defs>
<linearGradient gradientUnits="userSpaceOnUse" id="coneGradient" x1="0" x2="0" y1="0" y2="-44">
<stop offset="0%" stop-color="#ffffff" stop-opacity="0.4"></stop>
<stop offset="100%" stop-color="#ffffff" stop-opacity="0"></stop>
</linearGradient>
</defs>
<!-- Navigation Arrow Puck (Crisp Monochrome) -->
<circle cx="0" cy="0" fill="#000000" r="14" stroke="#ffffff" stroke-width="2.5"></circle>
<!-- Sharp Chevron Vector pointing forward (Up) -->
<path d="M0 -7.5 L6.5 5.5 L0 2.5 L-6.5 5.5 Z" fill="#ffffff"></path>
</g>
</svg>
</div>
<!-- END: MapBackgroundCanvas -->
<!-- BEGIN: TopInterfaceArea -->
<div class="relative z-10 pt-2 px-3 flex flex-col gap-2" data-purpose="top-hud">
<!-- iOS Status Bar & Dynamic Island -->
<header class="flex items-center justify-between text-[13px] font-semibold tracking-tight text-white px-3 pt-1 pb-0.5">
<span class="font-medium tracking-normal text-[14px]">9:41</span>
<!-- Dynamic Island pill -->
<div class="h-6 w-28 bg-black border border-neutral-800 rounded-full flex items-center justify-between px-2.5 shadow-inner">
<div class="flex items-center gap-1">
<span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span>
<span class="text-[9px] tracking-wider text-neutral-400 font-mono">INS:LOCK</span>
</div>
<div class="w-2.5 h-2.5 rounded-full bg-neutral-900 border border-neutral-700"></div>
</div>
<!-- Status Icons -->
<div class="flex items-center space-x-1.5 text-neutral-200">
<svg class="w-3.5 h-3.5" fill="currentColor" viewBox="0 0 24 24">
<path d="M12 3c-4.97 0-9 4.03-9 9 0 2.12.74 4.07 1.97 5.61L4.35 18.23c-.39.39-.39 1.02 0 1.41.39.39 1.02.39 1.41 0l.62-.62C8.01 20.25 9.91 21 12 21c4.97 0 9-4.03 9-9s-4.03-9-9-9zm0 2c3.87 0 7 3.13 7 7 0 1.63-.56 3.13-1.5 4.34L6.66 5.5C7.87 4.56 9.37 4 11 4zm-7 8c0-1.63.56-3.13 1.5-4.34L16.34 18.5C15.13 19.44 13.63 20 12 20c-3.87 0-7-3.13-7-7z"></path>
</svg>
<svg class="w-3.5 h-3.5" fill="currentColor" viewBox="0 0 24 24">
<path d="M12 4C7.31 4 3.07 5.9 0 8.98L12 21 24 8.98A16.88 16.88 0 0 0 12 4z"></path>
</svg>
<!-- Battery Pill -->
<div class="w-5 h-2.5 border border-white/80 rounded-sm p-0.5 flex items-center">
<div class="h-full w-3.5 bg-white rounded-2xs"></div>
</div>
</div>
</header>
<!-- Primary Maneuver Header Bar (Pitch Black with Stark White Type) -->
<section class="bg-black/95 backdrop-blur-xl border border-neutral-800/90 rounded-2xl p-3 shadow-2xl transition-all" data-purpose="primary-turn-instruction">
<div class="flex items-center justify-between gap-3">
<!-- Maneuver Direction Symbol -->
<div class="w-12 h-12 rounded-xl bg-neutral-900 border border-neutral-700/80 flex items-center justify-center flex-shrink-0 shadow-inner">
<!-- Sharp upward navigation arrow straight -->
<svg class="w-7 h-7 text-white" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.6" viewBox="0 0 24 24">
<line x1="12" x2="12" y1="19" y2="5"></line>
<polyline points="6 11 12 5 18 11"></polyline>
</svg>
</div>
<!-- Street Instruction Text -->
<div class="flex-1 min-w-0">
<div class="flex items-baseline space-x-2">
<span class="text-xl font-bold tracking-tight text-white truncate">W 47th St</span>
</div>
<p class="text-xs text-neutral-400 font-medium truncate flex items-center gap-1.5 mt-0.5">
<span>toward</span>
<span class="text-neutral-200 font-semibold underline decoration-neutral-600 underline-offset-2">Broadway</span>
</p>
</div>
<!-- Audio Voice Pill / Assistant Mic -->
<button aria-label="Voice Navigation Assistant" class="w-10 h-10 rounded-full bg-neutral-900 hover:bg-neutral-800 active:scale-95 border border-neutral-700/80 flex items-center justify-center text-white transition-all shadow-md">
<svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
<path d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 02-3-3V5a3 3 0 116 0v6a3 3 0 02-3 3z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
</div>
<!-- Next Maneuver Micro Sub-Bar -->
<div class="mt-2.5 pt-2 border-t border-neutral-800/80 flex items-center justify-between text-[11px] text-neutral-400">
<div class="flex items-center space-x-1.5">
<span class="text-neutral-500 uppercase tracking-widest text-[9px] font-mono">THEN</span>
<svg class="w-3 h-3 text-neutral-300 inline" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
<path d="M9 5l7 7-7 7" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
<span class="text-neutral-300 font-medium">Turn right onto Broadway</span>
</div>
<span class="font-mono text-neutral-300 font-semibold text-[10px]">500 FT</span>
</div>
</section>
<!-- Live Lane Guidance HUD Component -->
<div class="self-center bg-black/80 backdrop-blur-md px-3 py-1 rounded-full border border-neutral-800 flex items-center gap-2 shadow-lg" data-purpose="lane-guidance">
<span class="text-[9px] font-mono uppercase tracking-wider text-neutral-400">LANES</span>
<div class="flex items-center space-x-1">
<!-- Active Lane 1 (Straight - Selected) -->
<div class="w-5 h-5 rounded bg-white text-black flex items-center justify-center shadow-sm">
<svg class="w-3 h-3" fill="none" stroke="currentColor" stroke-width="3.5" viewBox="0 0 24 24">
<path d="M12 4v16m0-16l-4 4m4-4l4 4"></path>
</svg>
</div>
<!-- Active Lane 2 (Straight - Selected) -->
<div class="w-5 h-5 rounded bg-white text-black flex items-center justify-center shadow-sm">
<svg class="w-3 h-3" fill="none" stroke="currentColor" stroke-width="3.5" viewBox="0 0 24 24">
<path d="M12 4v16m0-16l-4 4m4-4l4 4"></path>
</svg>
</div>
<!-- Lane 3 (Right Only - Dimmed) -->
<div class="w-5 h-5 rounded bg-neutral-900 border border-neutral-800 text-neutral-600 flex items-center justify-center">
<svg class="w-3 h-3" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
<path d="M4 18h8a4 4 0 0 0 4-4V4m0 0l-3 3m3-3l3 3"></path>
</svg>
</div>
</div>
</div>
</div>
<!-- END: TopInterfaceArea -->
<!-- BEGIN: FloatingMapControls -->
<!-- Positioned on the right side matching reference screenshot -->
<aside class="absolute right-3.5 top-[235px] z-10 flex flex-col items-center space-y-2.5" data-purpose="map-action-buttons">

<!-- Search along route button -->
